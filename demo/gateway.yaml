apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gateway
  namespace: default
  labels:
    app: gateway-server
spec:
  selector:
    matchLabels:
      app: gateway-server
  template:
    metadata:
      labels:
        app: gateway-server
    spec:
      serviceAccountName: gateway-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      
      # apply to master node
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

      containers:
        - name: gateway
          image: localhost/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP